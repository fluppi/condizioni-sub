<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condizioni sub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#E8F0EF; --panel:#F6FAF9; --ink:#12303D; --muted:#557079;
  --sea:#1F6F78; --sea-soft:#B9D7D6; --sand:#B8893A; --coral:#B9472F;
  --line:#CFDEDD; --chart-wave:#1F6F78; --chart-wind:#B8893A; --chart-rain:#7FA7C9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E2431; --panel:#14303F; --ink:#DCEAEA; --muted:#8FAAB1;
    --sea:#5FB7B9; --sea-soft:#24505B; --sand:#D9AE62; --coral:#E07A5F;
    --line:#22495A; --chart-wave:#5FB7B9; --chart-wind:#D9AE62; --chart-rain:#7FA7C9;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h1{font-size:2rem;font-weight:700;margin:4px 0 2px;line-height:1.1}
h2{font-size:1.25rem;font-weight:600;margin:24px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px}
button:focus-visible,input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
/* Siti: gruppi Mare / Lago che vanno a capo, niente barra di scorrimento */
.spots{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group-label{flex:0 0 2.6rem;font:600 .7rem/1 Barlow,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.spots button{white-space:nowrap;background:transparent;padding:5px 13px;font-size:.92rem;transition:border-color .15s,background .15s}
.spots button:hover{border-color:var(--sea)}
.spots button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg);font-weight:600}
/* Azioni: discrete, sotto i siti */
.toolbar{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.toolbar button{border:none;background:transparent;color:var(--muted);font-size:.84rem;padding:4px 10px;border-radius:6px}
.toolbar button:hover{color:var(--ink);background:var(--panel)}
.toolbar #btnRemove{margin-left:auto;color:var(--coral)}
/* Elementi comuni: icone, tacche di livello, etichette */
.ic{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:var(--sea);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.dir{stroke:var(--muted);width:15px;height:15px;flex-basis:15px}
.ic.sand{stroke:var(--sand)} .ic.mut{stroke:var(--muted)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:13px;height:5px;border-radius:3px;background:var(--line)}
.meter.good i.on{background:var(--sea)} .meter.mid i.on{background:var(--sand)} .meter.bad i.on{background:var(--coral)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;line-height:1.2;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.good{color:var(--sea);border-color:var(--sea)} .tag.mid{color:var(--sand);border-color:var(--sand)} .tag.bad{color:var(--coral);border-color:var(--coral)}
.tag .ic{width:14px;height:14px;flex-basis:14px;stroke:currentColor}
.tag.big{font-size:.9rem;padding:4px 12px}
/* Dove andare: confronto tra i siti per un giorno */
.where{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0 0}
.where[hidden]{display:none}
.w-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.w-head b{font:600 1.15rem/1 "Barlow Condensed",sans-serif;display:flex;align-items:center;gap:6px}
.w-days{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.w-days button{padding:3px 9px;font-size:.8rem;background:transparent;border-color:transparent;color:var(--muted);text-transform:capitalize}
.w-days button.we{border-color:var(--line);color:var(--ink)}
.w-days button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg);font-weight:600}
.w-list{list-style:none;margin:8px 0 0;padding:0}
.w-list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.6rem 1fr auto auto auto;gap:12px;align-items:center;width:100%;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.w-list button:hover,.w-list button[aria-current]{background:color-mix(in srgb,var(--sea) 7%,transparent)}
.w-list button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.rk{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font:600 .82rem/1 Barlow,sans-serif;color:var(--muted);border:1px solid var(--line)}
.w-list li:first-child .rk{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.w-name{min-width:0} .w-name b{display:block;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-name small{color:var(--muted);font-size:.74rem}
.w-vis{font:700 1.25rem/1 "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.w-vis .meter{display:flex;margin-top:4px;justify-content:flex-end}
.w-temp{font-size:.86rem;color:var(--muted);white-space:nowrap}
.w-more{all:unset;cursor:pointer;color:var(--muted);font-size:.8rem;padding:6px 4px 0;display:block}
@media (max-width:560px){.w-temp{display:none}.w-name b{white-space:normal}.w-list button{grid-template-columns:1.6rem 1fr auto auto;gap:10px}.w-days{margin-left:0}}
/* Riepilogo di oggi */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:10px 0 8px}
.hero-top{display:flex;gap:12px 26px;align-items:center;flex-wrap:wrap}
.eyebrow{display:block;font:600 .72rem/1 Barlow,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero-num{font:700 3.4rem/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:6px 0 6px;white-space:nowrap}
.hero-num small{font-size:1.4rem;font-weight:600;color:var(--muted)}
.hero-main .meter i{width:22px;height:6px}
.hero-side{flex:1 1 240px;min-width:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.now:empty{display:none}
.t{display:flex;gap:8px;align-items:flex-start;min-width:0}
.t>span{min-width:0}
.t b{display:block;font:600 1.3rem/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.t small{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--muted);font-size:.76rem;line-height:1.3;margin-top:3px}
.t .ic{margin-top:2px}
/* Giorni: una riga per giorno, con le stesse colonne allineate */
.days{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:3.4rem 8.4rem 1fr 1rem;gap:16px;align-items:center;width:100%;padding:12px 16px;cursor:pointer}
.day>button:hover{background:color-mix(in srgb,var(--sea) 7%,transparent)}
.day>button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.day.we .d-date b{color:var(--sea)}
.d-date b{display:block;font:700 1.2rem/1 "Barlow Condensed",sans-serif;text-transform:capitalize}
.d-date small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.d-date .wx{display:block;font-size:1.1rem;margin-top:4px;line-height:1}
.vis-num{display:block;font:700 1.7rem/1 "Barlow Condensed",sans-serif;white-space:nowrap;margin-bottom:6px}
.vis-num small{font-size:1rem;font-weight:600;color:var(--muted)}
.d-cols{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:12px;align-items:center;min-width:0}
.c{display:flex;gap:7px;align-items:flex-start;min-width:0}
.c>span{min-width:0}
.c b{display:block;font-weight:600;font-size:.95rem;line-height:1.25;white-space:nowrap}
.c small{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:.76rem;line-height:1.3;white-space:nowrap}
.c.surf{flex-direction:column;gap:5px;align-items:flex-start}
.chev{color:var(--muted);font-size:1.3rem;transition:transform .2s;justify-self:end}
.day>button[aria-expanded="true"] .chev{transform:rotate(90deg)}
@media (max-width:700px){
  .day>button{grid-template-columns:3.4rem 1fr 1rem;row-gap:12px}
  .d-cols{grid-column:1 / -1;grid-row:2;grid-template-columns:1fr 1fr;gap:10px 14px}
}
/* Dettaglio del giorno */
.detail{padding:2px 16px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 28px}
.detail[hidden]{display:none}   /* senza questa riga display:grid annulla l’attributo hidden */
.detail .full{grid-column:1 / -1}
@media (max-width:640px){.detail{grid-template-columns:minmax(0,1fr)}}   /* minmax(0,…): il grafico non allarga la colonna oltre lo schermo */
.sec h3{display:flex;align-items:center;gap:6px;font:600 .7rem/1 Barlow,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px 14px}
.tiles .t b{font:600 1rem/1.2 Barlow,sans-serif}
.facs{display:flex;flex-wrap:wrap;gap:6px}
.fac{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;line-height:1.2;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.fac .ic{width:15px;height:15px;flex-basis:15px}
.fac em{font-style:normal;font-weight:600;color:var(--coral)}
.fac.mid{border-color:var(--sand)} .fac.bad{border-color:var(--coral)} .fac.good{border-color:var(--sea)}
.surf-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rose{width:64px;height:64px;flex:0 0 64px}
.rose .ring{fill:none;stroke:var(--line)} .rose .sh{fill:var(--sea-soft)}
.rose text{font:600 8px Barlow,sans-serif;fill:var(--muted)}
.rose .wv{fill:var(--sea)} .rose .wd{fill:var(--sand)}
.river{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;font-size:.9rem}
.river b{font-weight:600}
.river small{color:var(--muted);font-size:.78rem}
.spark{display:block;width:104px;height:26px;flex:0 0 104px}
.spark rect{fill:var(--sea-soft)} .spark rect.hi{fill:var(--sand)}
.spark line{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.prof-body{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;font-size:.9rem}
.prof-t{display:grid;grid-template-columns:auto auto;gap:3px 14px;min-width:8rem}
.prof-t div{display:contents}
.prof-t span{color:var(--muted)}
.prof-note{font-size:.78rem;color:var(--muted);margin-top:8px}
.prof svg.pf{width:210px;max-width:100%;height:auto;overflow:visible}
.prof svg.pf text{font:10px Barlow,system-ui,sans-serif;fill:var(--muted)}
.prof svg .g{stroke:var(--line);stroke-width:1}
.prof svg .tc{stroke:var(--sand);stroke-width:1;stroke-dasharray:3 3}
.prof svg .p{fill:none;stroke:var(--sea);stroke-width:2.2;stroke-linejoin:round}
.chartbox{position:relative;height:200px}
.add{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.add input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row input{flex:1 1 120px}
.results{list-style:none;padding:0;margin:8px 0 0}
.results button{border-radius:8px;width:100%;text-align:left;margin-top:4px}
.msg{color:var(--coral);font-size:.92rem}
.msg:empty{display:none}
/* Diario delle immersioni */
.add select{flex:0 0 auto;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.log .l-d{color:var(--muted);font-size:.8rem}
.log .l-s{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.log .l-s small{display:block;color:var(--muted);font-size:.78rem}
.log .l-v{text-align:right;white-space:nowrap}
.log .l-v b{display:block;font:700 1.15rem/1 "Barlow Condensed",sans-serif}
.log .l-v small{color:var(--muted);font-size:.74rem}
.log a{color:var(--sea);font-size:.78rem;text-decoration:none;white-space:nowrap}
.log .l-x{border:none;background:transparent;color:var(--muted);padding:4px 6px}
.log-sum{color:var(--muted);font-size:.84rem;margin:10px 0 0}
.log-sum:empty{display:none}
.log-tools button{border:none;background:transparent;color:var(--muted);font-size:.84rem;padding:4px 10px 4px 0}
footer{color:var(--muted);font-size:.8rem;margin:32px 0 16px}
footer a{color:var(--sea)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 9c2.2 0 2.8 2 5 2s2.8-2 5-2 2.8 2 5 2 2.8-2 5-2M2 15c2.2 0 2.8 2 5 2s2.8-2 5-2 2.8 2 5 2 2.8-2 5-2"/></symbol>
  <symbol id="i-swell" viewBox="0 0 24 24"><path d="M2 14c3.5 0 4.5-5 10-5s6.5 5 10 5"/><path d="M2 19h20"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 9h10.5a2.5 2.5 0 1 0-2.4-3.2M3 14h15a2.5 2.5 0 1 1-2.4 3.2M3 19h6"/></symbol>
  <symbol id="i-temp" viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 0-2 2v8.5a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z"/><path d="M12 10v6"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17.5 15H7zM8 18.5l-1 2M12 18.5l-1 2M16 18.5l-1 2"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1 .6-9 6 6 0 0 1 11.5 1.7A3.7 3.7 0 0 1 18.3 18H7z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 20V5M6.5 10.5L12 5l5.5 5.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-depth" viewBox="0 0 24 24"><path d="M12 3v13M7 11.5l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19l7-7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6l7-3z"/></symbol>
</svg>
<main>
  <h1 id="title">Condizioni sub</h1>
  <p class="sub" id="meta">Caricamento…</p>

  <nav class="spots" id="spots" aria-label="Siti d’immersione"></nav>
  <div class="toolbar">
    <button id="btnAdd" aria-expanded="false">＋ Aggiungi sito</button>
    <button id="btnRefresh">↻ Aggiorna</button>
    <button id="btnLog" aria-expanded="false">✎ Ho visto…</button>
    <button id="btnBase">Visibilità tipica</button>
    <button id="btnShelter">Ridosso</button>
    <button id="btnRemove">Rimuovi sito</button>
  </div>

  <section class="add" id="addBox" hidden>
    <input id="q" placeholder="Cerca località (es. Portofino)" autocomplete="off">
    <ul class="results" id="results"></ul>
    <div class="row">
      <input id="lat" placeholder="Lat (43.170)" inputmode="decimal">
      <input id="lon" placeholder="Lon (6.535)" inputmode="decimal">
      <input id="nm" placeholder="Nome">
      <input id="baseIn" placeholder="Visibilità tipica (m)" inputmode="decimal">
    </div>
    <label class="row" style="align-items:center"><input type="checkbox" id="isLake" style="flex:0 0 auto;width:auto"> È un lago (niente dati di onda)</label>
    <div class="row">
      <button id="btnSaveManual">Salva coordinate</button>
      <button id="btnGeo">Usa la mia posizione</button>
    </div>
    <p class="msg" id="addMsg"></p>
  </section>

  <section class="add" id="logBox" hidden>
    <div class="row" style="margin-top:0">
      <select id="logDay" aria-label="Giorno dell’immersione"></select>
      <input id="logM" placeholder="Visibilità vista (m)" inputmode="decimal">
      <input id="logZ" placeholder="Profondità (m)" inputmode="decimal">
      <input id="logNote" placeholder="Nota">
      <button id="btnLogSave">Salva</button>
    </div>
    <p class="msg" id="logMsg"></p>
    <p class="log-sum" id="logSum"></p>
    <ul class="log" id="logList"></ul>
    <div class="row log-tools">
      <button id="btnLogCopy">Copia</button>
      <button id="btnLogDown">Scarica</button>
      <button id="btnLogImport">Importa</button>
    </div>
  </section>

  <section class="where" id="where" hidden></section>

  <section class="hero">
    <div id="heroTop"></div>
    <div class="now" id="now"></div>
  </section>

  <ul class="days" id="days"></ul>

  <footer>
    Dati: <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a> ·
    <a href="https://data.marine.copernicus.eu/" rel="noopener">Copernicus Marine</a> ·
    <a href="https://www.alplakes.eawag.ch" rel="noopener">Alplakes, Eawag</a> (CC BY 4.0) ·
    <a href="https://coastwatch.pfeg.noaa.gov/erddap/" rel="noopener">NOAA</a>.
    Stime, non misure: verifica sempre sul posto.
  </footer>
</main>

<script>
"use strict";

/* ---------- Configurazione ---------- */
const DEFAULT_SPOTS = [
  // base = visibilità orizzontale tipica (m) in una giornata buona: tarala con “Visibilità tipica”
  // shelter = direzioni (da cui arrivano vento/onda) da cui il sito è riparato; indicative, modificabili con “Ridosso”
  { name: "Cavalaire-sur-Mer", lat: 43.170, lon: 6.535, base: 20, shelter: ["O", "ONO", "NO", "NNO", "N", "NNE"] },
  // rivers: fiumi che scaricano vicino al sito (punto sull’alveo, poco a monte della foce); w = peso 0–1

/* ---------- Fetch ---------- */
async function getJSON(url, ms = 12000){
  let t;
  const timeout = new Promise((_, rej) => { t = setTimeout(() => rej(new Error("timeout")), ms); });
  try {
    const r = await Promise.race([fetch(url), timeout]);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function marineURL(s, days = 8){
  return "https://marine-api.open-meteo.com/v1/marine?latitude=" + s.lat + "&longitude=" + s.lon +
    "&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,swell_wave_direction," +
    "wind_wave_height,sea_surface_temperature,ocean_current_velocity,ocean_current_direction" +
    "&timezone=auto&past_days=4&forecast_days=" + days + "&cell_selection=sea";
}
function weatherURL(s){
  return "https://api.open-meteo.com/v1/forecast?latitude=" + s.lat + "&longitude=" + s.lon +
    "&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,cloud_cover,temperature_2m" +
    "&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum" +
    "&timezone=auto&past_days=4&forecast_days=8&wind_speed_unit=kn";
}

async function getChlorophyll(s){
  const d = 0.08; // box ~±9 km, i pixel costieri sono spesso vuoti
  for (const src of CHL_SOURCES){
    const lonPart = "[(" + (s.lon - d).toFixed(3) + "):(" + (s.lon + d).toFixed(3) + ")]";
    const latOrders = [
      "[(" + (s.lat + d).toFixed(3) + "):(" + (s.lat - d).toFixed(3) + ")]",
      "[(" + (s.lat - d).toFixed(3) + "):(" + (s.lat + d).toFixed(3) + ")]"
    ];
    for (const latPart of latOrders){
      try {
        const q = src.v + "[(last)]" + latPart + lonPart;
        const j = await getJSON(src.base + src.id + ".json?" + encodeURIComponent(q), 9000);
        const cols = j.table.columnNames, rows = j.table.rows;
        const iv = cols.indexOf(src.v), it = cols.indexOf("time");
        const vals = rows.map(r => r[iv]).filter(v => typeof v === "number" && isFinite(v));
        if (!vals.length) return { value: null, date: rows[0]?.[it] ?? null };
        return { value: vals.reduce((a, b) => a + b, 0) / vals.length, date: rows[0][it] };
      } catch { /* prova l’ordine successivo / dataset successivo */ }
    }
  }
  return null;
}

async function getRivers(s){
  if (!s.rivers || !s.rivers.length) return [];
  const res = await Promise.all(s.rivers.map(r =>
    getJSON("https://flood-api.open-meteo.com/v1/flood?latitude=" + r.lat + "&longitude=" + r.lon +
            "&daily=river_discharge&past_days=60&forecast_days=10")
      .then(j => ({ ...r, time: j.daily.time, q: j.daily.river_discharge }))
      .catch(() => null)));
  return res.filter(Boolean);
}

const TEMP_URL = "https://raw.githubusercontent.com/fluppi/condizioni-sub/main/data/temperatura.json";
let tempData = null, tempT = 0;
async function getTemps(){
  if (tempData && Date.now() - tempT < 3600e3) return false;
  try {
    const j = await getJSON(TEMP_URL + "?h=" + Math.floor(Date.now() / 3600e3), 8000);
    const changed = !tempData || j.updated !== tempData.updated;
    tempData = j; tempT = Date.now();
    return changed;
  } catch { return false; }
}

/* ---------- Analisi ---------- */
function index(h){ const m = new Map(); h.time.forEach((t, i) => m.set(t, i)); return m; }
const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, c) => p + c, 0) / v.length : null; };
const max = a => { const v = a.filter(x => x != null); return v.length ? Math.max(...v) : null; };
const sum = a => a.filter(x => x != null).reduce((p, c) => p + c, 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// Quanto l’onda “arriva” sul fondo: velocità dell’acqua vicino al fondale a 10 m di profondità (m/s).
// Un’onda lunga smuove il fondo molto più di un’onda corta della stessa altezza.
function bottomSpeed(h, t, depth = 10){
  if (h == null || t == null || t <= 0) return null;
  const w = 2 * Math.PI / t; let k = w * w / 9.81;
  for (let i = 0; i < 25; i++) k = w * w / (9.81 * Math.tanh(k * depth));
  return Math.PI * h / (t * Math.sinh(k * depth));
}

// Quanti giorni indietro pesa una piena: sul lago il torbido resta più a lungo che in mare
const RIVER_DECAY = [1, 1, 0.8, 0.6, 0.45, 0.3];
const dayDiff = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);

function analyse(marine, wx, chl, base, rivers = [], shelter = [], obs = null, turbObs = null, from = null){
  const mh = marine ? marine.hourly : null, wh = wx.hourly;
  const mi = mh ? index(mh) : new Map();
  const times = wh.time; // asse orario di riferimento
  const today = (times.find(t => t.slice(0, 10) >= localToday(wx)) || times[times.length - 1]).slice(0, 10);
  const dates = [...new Set(times.map(t => t.slice(0, 10)))].filter(d => d >= (from || today));   // from: anche un giorno passato (diario)
  const pick = (arr, t) => { if (!arr) return null; const i = mi.get(t); return i == null ? null : arr[i]; };
  const M = k => mh ? mh[k] : null;
  // portata di riferimento: il maggiore tra mediana e media dei 60 giorni passati.
  // Dopo settimane di secca la mediana è minuscola e anche una portata modesta sembrerebbe “5× il normale”.
  const riv = rivers.map(r => {
    const past = r.q.filter((v, i) => v != null && r.time[i] < today).sort((a, b) => a - b);
    const median = past.length ? past[Math.floor(past.length / 2)] : null;
    const avg = past.length ? past.reduce((x, y) => x + y, 0) / past.length : null;
    return { ...r, median: median == null ? null : Math.max(median, avg) };
  });

  return dates.map(date => {
    const startIdx = times.indexOf(date + "T" + String(WINDOW_START).padStart(2, "0") + ":00");
    const win = [], before72 = [], before36 = [], all = [];
    times.forEach((t, i) => {
      if (t.startsWith(date)) all.push(i);
      if (t.startsWith(date)) { const h = +t.slice(11, 13); if (h >= WINDOW_START && h < WINDOW_END) win.push(i); }
      if (startIdx >= 0 && i < startIdx && i >= startIdx - 72) before72.push(i);
      if (startIdx >= 0 && i < startIdx && i >= startIdx - 36) before36.push(i);
    });
    const W = f => win.map(i => f(times[i], i));
    // misura satellitare di trasparenza valida per questo giorno (al massimo 6 giorni prima in mare, 10 sul lago):
    // le penalità contano solo per ciò che succede DOPO la misura, perché il resto è già dentro il dato
    const age = obs ? dayDiff(obs.date, date) : null;
    const secchi = obs && age >= 0 && age <= (mh ? 6 : 10) ? { ...obs, age } : null;   // il mare cambia più in fretta del lago
    const obsT = secchi ? secchi.date + "T12:00" : null;
    const after = i => !obsT || times[i] >= obsT;
    const look = mh ? 2 : 5;
    const d = {
      date, all,
      hs: mean(W(t => pick(M("wave_height"), t))),
      hsMax: max(W(t => pick(M("wave_height"), t))),
      tp: mean(W(t => pick(M("wave_period"), t))),
      swell: mean(W(t => pick(M("swell_wave_height"), t))),
      sst: mean(W(t => pick(M("sea_surface_temperature"), t))),
      cur: mean(W(t => pick(M("ocean_current_velocity"), t))),
      wind: mean(W((t, i) => wh.wind_speed_10m[i])),
      gust: max(W((t, i) => wh.wind_gusts_10m[i])),
      rain72: sum(before72.map(i => wh.precipitation[i])),
      rainVis: sum(before72.filter(after).map(i => wh.precipitation[i])),
      prevHs: max(before36.filter(after).map(i => pick(M("wave_height"), times[i]))),
      prevU: max(before36.filter(after).map(i => bottomSpeed(pick(M("wave_height"), times[i]), pick(M("wave_period"), times[i])))),
      dayU: bottomSpeed(mean(W(t => pick(M("wave_height"), t))), mean(W(t => pick(M("wave_period"), t)))),
      prevGust: max(before36.filter(after).map(i => wh.wind_gusts_10m[i])),
      secchi,
      // torbidità sottocosta (pixel da 100 m): vale per i 6 giorni dopo l’immagine
      turb: turbObs && dayDiff(turbObs.date, date) >= 0 && dayDiff(turbObs.date, date) <= 6 ? turbObs : null,
      prevWaveDir: circMean(before36.filter(after).map(i => pick(M("wave_direction"), times[i]))),
      lake: !mh, base, shelter,
      windDir: circMean(W((t, i) => wh.wind_direction_10m[i])),
      waveDir: circMean(W(t => pick(M("wave_direction"), t))),
      swellDir: circMean(W(t => pick(M("swell_wave_direction"), t))),
      swellTp: mean(W(t => pick(M("swell_wave_period"), t))),
      windWave: mean(W(t => pick(M("wind_wave_height"), t))),
      curDir: circMean(W(t => pick(M("ocean_current_direction"), t))),
      cloud: mean(W((t, i) => wh.cloud_cover ? wh.cloud_cover[i] : null)),
      airNow: mean(W((t, i) => wh.temperature_2m ? wh.temperature_2m[i] : null)),
      ...dailyFor(wx, date),
      best: bestWindow(win, times, wh.wind_gusts_10m, t => pick(M("wave_height"), t)),
      riv: riv.map(r => {
        // la piena pesa per alcuni giorni (di più sul lago), con effetto che si attenua
        const at = day => { const i = r.time.indexOf(day); return i < 0 ? null : r.q[i]; };
        let eff = null, peak = null, peakAgo = 0;
        for (let k = 0; k <= look; k++){
          const day = addDays(date, -k), q = at(day);
          if (q == null || (secchi && day <= secchi.date)) continue;   // già dentro la misura satellitare
          if (eff == null || q * RIVER_DECAY[k] > eff) { eff = q * RIVER_DECAY[k]; peak = q; peakAgo = k; }
        }
        const hist = [6, 5, 4, 3, 2, 1, 0].map(k => at(addDays(date, -k)));
        return { name: r.name, w: r.w, q: at(date), peak, peakAgo, hist, norm: r.median,
                 ratio: eff != null && r.median ? eff / r.median : null };
      }),
      chl: chl?.value ?? null
    };
    Object.assign(d, scoreVis(d), scoreSurf(d));
    return d;
  });
}

const CARD = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const cardinal = deg => deg == null ? "n/d" : CARD[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
function circMean(a){
  const v = a.filter(x => x != null); if (!v.length) return null;
  const sx = v.reduce((p, d) => p + Math.sin(d * Math.PI / 180), 0), cx = v.reduce((p, d) => p + Math.cos(d * Math.PI / 180), 0);
  return (Math.atan2(sx, cx) * 180 / Math.PI + 360) % 360;
}
// nomi dei venti: rosa dei venti per il mare, venti tipici del Garda per i laghi
function windName(deg, lake){
  if (deg == null) return "";
  const i = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
  if (lake) return i === 0 || i === 7 || i === 1 ? "Pelèr" : (i >= 3 && i <= 5 ? "Ora" : "");
  return ["Tramontana","Grecale","Levante","Scirocco","Ostro","Libeccio","Ponente","Maestrale"][i];
}
function weatherText(code){
  if (code == null) return ["", ""];
  if (code === 0) return ["☀️", "Sereno"];
  if (code <= 2) return ["🌤️", "Poco nuvoloso"];
  if (code === 3) return ["☁️", "Coperto"];
  if (code <= 48) return ["🌫️", "Nebbia"];
  if (code <= 57) return ["🌦️", "Pioviggine"];
  if (code <= 67) return ["🌧️", "Pioggia"];
  if (code <= 77) return ["❄️", "Neve"];
  if (code <= 82) return ["🌦️", "Rovesci"];
  return ["⛈️", "Temporale"];
}
// fase lunare (utile per notturne e plancton): 0 = nuova, 0,5 = piena
function moon(dateIso){
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const ph = (((new Date(dateIso + "T21:00:00Z") - ref) / 864e5) % syn + syn) % syn / syn;
  const illum = Math.round((1 - Math.cos(2 * Math.PI * ph)) / 2 * 100);
  const icons = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  const names = ["Luna nuova","Crescente","Primo quarto","Gibbosa crescente","Luna piena","Gibbosa calante","Ultimo quarto","Calante"];
  const k = Math.round(ph * 8) % 8;
  return icons[k] + " " + names[k] + " (" + illum + "%)";
}
// finestra di 3 ore più tranquilla tra le 8 e le 18 (raffiche + onda)
function bestWindow(win, times, gusts, wave){
  let best = null;
  for (let j = 0; j + 2 < win.length; j++){
    const idx = win.slice(j, j + 3);
    const score = mean(idx.map(i => gusts[i])) + 10 * (mean(idx.map(i => wave(times[i]))) || 0);
    if (best == null || score < best.score) best = { score, from: +times[idx[0]].slice(11, 13) };
  }
  return best ? best.from + "–" + (best.from + 3) : null;
}
const hhmm = iso => iso ? iso.slice(11, 16) : "n/d";

function addDays(iso, n){ const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

function dailyFor(wx, date){
  const dd = wx.daily; if (!dd) return {};
  const i = dd.time.indexOf(date); if (i < 0) return {};
  return { tMax: dd.temperature_2m_max[i], tMin: dd.temperature_2m_min[i], code: dd.weather_code[i],
           rainDay: dd.precipitation_sum[i], sunrise: dd.sunrise[i], sunset: dd.sunset[i] };
}

function localToday(wx){
  // data corrente nel fuso del sito
  const off = wx.utc_offset_seconds || 0;
  return new Date(Date.now() + off * 1000).toISOString().slice(0, 10);
}

function scoreVis(d){
  // 1) Punto di partenza: visibilità tipica del sito, limitata dalla clorofilla se disponibile.
  //    Kd490 da clorofilla (Morel), visibilità orizzontale ≈ 0,65 / Kd (stima empirica).
  let start = d.base, chlVis = null; const fac = [];
  if (d.chl != null){
    const kd = 0.0166 + 0.0773 * Math.pow(d.chl, 0.6715);
    chlVis = 0.65 / kd;
    start = Math.min(d.base * 1.2, chlVis);
  }
  if (d.secchi){
    // Trasparenza dal satellite: la visibilità orizzontale è circa il 75% della profondità di Secchi.
    // Le penalità sotto contano solo per ciò che succede dopo la misura.
    start = clamp(SECCHI_TO_HORIZ * d.secchi.v, 1, Math.min(30, d.base * 1.6));
    fac.push({ ic: "eye", t: "satellite " + dayNum(d.secchi.date) + (d.secchi.lakeWide ? " (lago)" : "") + ": " + fmt(d.secchi.v, 0, " m"), tone: "good" });
  } else {
    fac.push({ ic: "pin", t: "tipica " + d.base + " m" });
    if (chlVis != null && chlVis < d.base) fac.push({ ic: "leaf", t: "plancton " + planktonWord(d.chl).toLowerCase() + ": max " + Math.round(chlVis) + " m", tone: "mid" });
  }
  // 2) Fattori che riducono la visibilità.
  let f = 1;
  const step = (val, rules, ic, text, prot) => {
    if (val == null) return;
    for (const [thr, k] of rules) if (val > thr) { f *= k; fac.push({ ic, t: text(val), pct: Math.round((1 - k) * 100), prot }); return; }
  };
  // Torbidità sottocosta (pixel da 100 m): per ora è solo mostrata nel dettaglio (TURB_IN_STIMA = false).
  // Le prime letture reali (nov 2026: 3–11 FNU con Secchi a 1 km di 9–14 m) sono troppo alte per fidarsi delle soglie.
  if (TURB_IN_STIMA && d.turb) step(d.turb.tur, [[8, 0.4], [4, 0.6], [2, 0.8]], "pin", () => "costa torbida " + dayNum(d.turb.date));
  step(d.secchi ? d.rainVis : d.rain72, [[60, 0.4], [30, 0.6], [15, 0.75], [5, 0.9]], "rain", v => "pioggia " + v.toFixed(0) + " mm");
  // onda da un settore riparato: al sito arriva circa la metà, e rimescola meno il fondo
  const prevProt = sheltered(d.prevWaveDir, d.shelter), dayProt = sheltered(d.waveDir, d.shelter);
  step(d.prevU == null ? null : d.prevU * (prevProt ? 0.5 : 1), [[0.9, 0.4], [0.6, 0.55], [0.35, 0.75], [0.15, 0.9]], "swell",
    () => "mare prima " + fmt(d.prevHs, 1, " m"), prevProt);
  if (d.lake) step(d.prevGust, [[30, 0.65], [22, 0.8], [16, 0.9]], "wind", v => "vento prima " + v.toFixed(0) + " kn");
  for (const r of d.riv || []){
    if (r.ratio == null) continue;
    const rules = [[4, 0.5], [2.5, 0.65], [1.6, 0.8], [1.2, 0.92]];
    const hit = rules.find(([thr]) => r.ratio > thr);
    if (!hit) continue;
    const k = 1 - r.w * (1 - hit[1]);
    f *= k;
    fac.push({ ic: "drop", t: r.name + " " + riverState(r).label, pct: Math.round((1 - k) * 100) });
  }
  step(d.dayU == null ? null : d.dayU * (dayProt ? 0.5 : 1), [[0.35, 0.8], [0.15, 0.9]], "wave",
    () => "onda " + fmt(d.hs, 1, " m") + " · " + fmt(d.tp, 0, " s"), dayProt);
  const m = Math.max(1, start * f);
  const r = m / d.base;
  const lab = r >= 0.85 ? "Ottima" : r >= 0.65 ? "Buona" : r >= 0.45 ? "Discreta" : r >= 0.3 ? "Scarsa" : "Pessima";
  return {
    visM: m, visLo: Math.max(1, Math.round(m * 0.8)), visHi: Math.round(m * 1.15),
    visVert: Math.round(m * 1.4), visRatio: r, visLabel: lab, visFac: fac
  };
}

const SECCHI_TO_HORIZ = 0.75;   // rapporto tra visibilità orizzontale del sub e profondità di Secchi (da tarare)

// Riparo: la direzione media (da cui arriva) cade in un settore protetto del sito?
const sheltered = (deg, list) => deg != null && (list || []).includes(cardinal(deg));

function scoreSurf(d){
  let s = 5; const fac = [];
  const tone = pts => pts >= 2.5 ? "bad" : pts >= 1.5 ? "mid" : pts > 0 ? "" : "good";
  // onda: se arriva da un settore riparato conta la metà
  if (d.hs != null){
    const prot = sheltered(d.waveDir, d.shelter), hs = prot ? d.hs * 0.5 : d.hs;
    let pts = hs > 1.5 ? 3.5 : hs > 1 ? 2.5 : hs > 0.7 ? 1.5 : hs > 0.4 ? 0.5 : 0;
    if (d.tp != null && d.tp < 5 && d.hs > 0.5 && !prot) pts += 0.5;     // onda corta e ripida
    s -= pts;
    fac.push({ ic: "wave", t: fmt(d.hs, 1, " m") + " · " + fmt(d.tp, 0, " s") + " · " + cardinal(d.waveDir), tone: tone(pts), prot });
  }
  // raffiche: da un settore riparato contano il 75%
  if (d.gust != null){
    const prot = sheltered(d.windDir, d.shelter), g = prot ? d.gust * 0.75 : d.gust;
    const pts = g > 30 ? 2.5 : g > 22 ? 1.5 : g > 15 ? 0.5 : 0;
    s -= pts;
    fac.push({ ic: "wind", t: "max " + fmt(d.gust, 0, " kn") + " · " + cardinal(d.windDir), tone: tone(pts), prot });
  }
  s = clamp(Math.round(s * 2) / 2, 1, 5);
  const lab = s >= 4.5 ? "Calmo" : s >= 3.5 ? "Ok" : s >= 2.5 ? "Mosso" : s >= 1.5 ? "Impegnativo" : "Sconsigliato";
  return { surf: s, surfLabel: lab, surfFac: fac };
}

/* ---------- Render: mattoncini ---------- */
const fmt = (v, n = 1, u = "") => v == null ? "n/d" : v.toFixed(n).replace(".", ",") + u;
const dayName = d => new Date(d + "T12:00").toLocaleDateString("it-IT", { weekday: "short" });
const dayNum = d => new Date(d + "T12:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" });
const isWeekend = d => [0, 6].includes(new Date(d + "T12:00").getDay());
const ico = (n, cls = "") => '<svg class="ic ' + cls + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
// freccia che indica verso dove va vento/onda/corrente (deg = direzione di provenienza)
const arrowFrom = deg => deg == null ? "" : '<svg class="ic dir" style="transform:rotate(' + Math.round(deg + 180) + 'deg)" aria-hidden="true"><use href="#i-arrow"/></svg>';
const arrowTo = deg => deg == null ? "" : arrowFrom(deg + 180);
// tacche di livello da 1 a 5: sostituiscono le parole
const toneOf = n => n >= 4 ? "good" : n >= 3 ? "mid" : "bad";
const meter = (n, label) => '<span class="meter ' + toneOf(n) + '" role="img" aria-label="' + label + '" title="' + label + '">' +
  [1, 2, 3, 4, 5].map(i => "<i" + (i <= n ? ' class="on"' : "") + "></i>").join("") + "</span>";
// forchetta di visibilità: quando i due estremi coincidono non scrive «1–1»
const rng = d => d.visHi > d.visLo ? d.visLo + "–" + d.visHi : d.visHi <= 1 ? "≤ 1" : "~" + d.visHi;
const visLevel = r => r >= 0.85 ? 5 : r >= 0.65 ? 4 : r >= 0.45 ? 3 : r >= 0.3 ? 2 : 1;
const clarityLevel = m => m >= 12 ? 5 : m >= 8 ? 4 : m >= 5 ? 3 : m >= 3 ? 2 : 1;
const surfLevel = s => Math.max(1, Math.round(s));
const TURB_IN_STIMA = false;   // true = la torbidità sottocosta riduce la stima di visibilità (da riaccendere dopo la taratura)
const turbLevel = t => t < 0.5 ? 5 : t < 1 ? 4 : t < 2 ? 3 : t < 4 ? 2 : 1;
// andamento rispetto all’immagine precedente: freccia su = più torbida, giù = più pulita
const turbTrend = t => t.prev == null || t.prev <= 0 ? "" :
  (t.tur > t.prev * 1.25 ? arrowFrom(180) : t.tur < t.prev * 0.8 ? arrowFrom(0) : "") + " prima " + fmt(t.prev, 1);
const turbWord = t => ["", "molto torbida", "torbida", "velata", "pulita", "molto pulita"][turbLevel(t)];
const clarityWord = m => ["", "molto torbida", "torbida", "media", "limpida", "molto limpida"][clarityLevel(m)];
const planktonWord = c => c == null ? null : c < 0.3 ? "Poco" : c < 1 ? "Medio" : "Molto";
const tile = (icon, value, cap) => '<div class="t">' + icon + "<span><b>" + value + "</b><small>" + cap + "</small></span></div>";
const col = (icon, main, sub) => '<span class="c">' + ico(icon) + "<span><b>" + main + "</b><small>" + sub + "</small></span></span>";
const surfTag = (d, big) => '<span class="tag ' + toneOf(surfLevel(d.surf)) + (big ? " big" : "") + '" title="Superficie">' + ico("wave") + d.surfLabel + "</span>";
const tAt = (d, z) => { const p = d.deep && d.deep.profile.find(x => x[0] === z); return p ? p[1] : null; };
const waterT = d => d.lake ? tAt(d, 1) : (d.sst != null ? d.sst : tAt(d, 1));

// Ordine: prima i siti più vicini a casa (Modena)
const HOME = { lat: 44.647, lon: 10.925 };
function distKm(s){
  const r = Math.PI / 180, dLat = (s.lat - HOME.lat) * r, dLon = (s.lon - HOME.lon) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(HOME.lat * r) * Math.cos(s.lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
}
function selectSpot(i){ sel = i; save(SEL_KEY, sel); renderSpots(); refresh(); }
function renderSpots(){
  $("spots").innerHTML = "";
  const groups = [["Mare", s => !s.lake], ["Lago", s => s.lake]].map(([label, test]) => {
    const idx = spots.map((s, i) => i).filter(i => test(spots[i])).sort((x, y) => distKm(spots[x]) - distKm(spots[y]));
    return [label, idx];
  }).filter(([, idx]) => idx.length)
    .sort((A, B) => distKm(spots[A[1][0]]) - distKm(spots[B[1][0]]));   // gruppo più vicino per primo
  groups.forEach(([label, idx]) => {
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = '<span class="group-label">' + label + "</span>";
    idx.forEach(i => {
      const b = document.createElement("button");
      b.textContent = spots[i].name; b.setAttribute("aria-pressed", i === sel);
      b.title = Math.round(distKm(spots[i])) + " km da Modena";
      b.onclick = () => selectSpot(i);
      g.appendChild(b);
    });
    $("spots").appendChild(g);
  });
  $("btnRemove").hidden = spots.length < 2;
}

/* ---------- Dove andare: il sito migliore per il giorno scelto ---------- */
const allDays = {};          // nome del sito -> giorni calcolati
let pickDay = null, whereAll = false;
// punteggio per confrontare siti diversi: superficie + visibilità (soprattutto i metri, in parte rispetto al solito del sito)
function siteScore(d){
  const sw = d.surf >= 3.5 ? 1 : d.surf >= 2.5 ? 0.75 : d.surf >= 1.5 ? 0.45 : 0.2;
  return sw * (0.35 * Math.min(d.visRatio, 1.2) / 1.2 + 0.65 * Math.min(d.visM, 20) / 20);
}
function renderWhere(){
  const el = $("where"), have = spots.filter(s => allDays[s.name]);
  if (have.length < 2) { el.hidden = true; return; }
  const dates = [...new Set(have.flatMap(s => allDays[s.name].map(d => d.date)))].sort();
  // giorno proposto: il prossimo giorno di weekend (oggi compreso, ma non se è già pomeriggio inoltrato)
  if (!pickDay || !dates.includes(pickDay)){
    const late = new Date().getHours() >= 15;
    pickDay = dates.find((dt, k) => isWeekend(dt) && !(k === 0 && late)) || dates[0];
  }
  const rows = spots.map((s, i) => ({ s, i, d: (allDays[s.name] || []).find(x => x.date === pickDay) }))
    .filter(r => r.d).sort((a, b) => siteScore(b.d) - siteScore(a.d));
  const shown = whereAll ? rows : rows.slice(0, 3);
  el.hidden = false;
  el.innerHTML =
    '<div class="w-head"><b>' + ico("star") + "Dove andare</b>" +
      '<div class="w-days">' + dates.map(dt => '<button data-d="' + dt + '" class="' + (isWeekend(dt) ? "we" : "") + '" aria-pressed="' + (dt === pickDay) + '">' +
        dayName(dt) + " " + new Date(dt + "T12:00").getDate() + "</button>").join("") + "</div></div>" +
    '<ol class="w-list">' + shown.map((r, k) =>
      '<li><button data-i="' + r.i + '"' + (r.i === sel ? ' aria-current="true"' : "") + '><span class="rk">' + (k + 1) + "</span>" +
        '<span class="w-name"><b>' + r.s.name + "</b><small>" + (r.s.lake ? "lago" : "mare") + " · " + Math.round(distKm(r.s)) + " km</small></span>" +
        surfTag(r.d) +
        '<span class="w-temp">' + (waterT(r.d) != null ? ico("temp", "mut") + " " + fmt(waterT(r.d), 0, "°") : "") + "</span>" +
        '<span class="w-vis">' + rng(r.d) + " m" + meter(visLevel(r.d.visRatio), "Visibilità " + r.d.visLabel.toLowerCase()) + "</span>" +
      "</button></li>").join("") + "</ol>" +
    (rows.length > 3 ? '<button class="w-more">' + (whereAll ? "meno ▴" : "tutti i " + rows.length + " siti ▾") + "</button>" : "") +
    (have.length < spots.length ? '<small class="w-name" style="display:block;padding-top:6px"><small>carico gli altri siti…</small></small>' : "");
  el.querySelectorAll(".w-days button").forEach(b => b.onclick = () => { pickDay = b.dataset.d; renderWhere(); });
  el.querySelectorAll(".w-list button").forEach(b => b.onclick = () => selectSpot(+b.dataset.i));
  const more = el.querySelector(".w-more"); if (more) more.onclick = () => { whereAll = !whereAll; renderWhere(); };
}

/* ---------- Riepilogo di oggi ---------- */
function heroHTML(days){
  const d = days[0]; if (!d) return "";
  const good = d.surf >= 3.5 && d.visRatio >= 0.65, bad = d.surf < 2.5 || d.visRatio < 0.3;
  const verdict = good ? ["Buone condizioni", "good", "check"] : bad ? ["Condizioni difficili", "bad", "wave"] : ["Condizioni discrete", "mid", "eye"];
  const rank = x => Math.min(x.visRatio, 1.3) * (x.surf / 5);
  const best = days.slice().sort((a, b) => rank(b) - rank(a))[0];
  const bestTag = best !== d && rank(best) > rank(d) * 1.15
    ? '<span class="tag big" title="Giorno migliore in arrivo">' + ico("star") + dayName(best.date) + " " + new Date(best.date + "T12:00").getDate() + " · " + rng(best) + " m</span>" : "";
  return '<div class="hero-top"><div class="hero-main"><span class="eyebrow">Oggi · ' + dayNum(d.date) + "</span>" +
    '<div class="hero-num">' + rng(d) + "<small> m</small></div>" +
    meter(visLevel(d.visRatio), "Visibilità " + d.visLabel.toLowerCase()) + "</div>" +
    '<div class="hero-side"><span class="tag big ' + verdict[1] + '">' + ico(verdict[2]) + verdict[0] + "</span>" + surfTag(d, true) + seenTag(d.date) + bestTag + "</div></div>";
}

// stato del fiume rispetto alla sua portata abituale
function riverState(r){
  const x = r.ratio != null ? r.ratio : (r.q != null && r.norm ? r.q / r.norm : null);
  if (x == null) return { label: "n/d", cls: "" };
  if (x > 4) return { label: "forte piena", cls: "bad" };
  if (x > 2.5) return { label: "in piena", cls: "bad" };
  if (x > 1.6) return { label: "ingrossato", cls: "mid" };
  if (x > 1.2) return { label: "sopra il solito", cls: "mid" };
  return { label: "normale", cls: "good" };
}
// una riga per fiume: nome, stato, barre degli ultimi 7 giorni (tratteggio = livello abituale)
function riverBlock(r){
  const st = riverState(r), n = v => fmt(v, v < 10 ? 1 : 0);
  const top = Math.max(...r.hist.filter(v => v != null), (r.norm || 0) * 1.5, 1);
  const bars = r.hist.map((v, i) => v == null ? "" :
    '<rect x="' + (i * 15 + 1) + '" y="' + (25 - v / top * 24).toFixed(1) + '" width="11" height="' + (v / top * 24).toFixed(1) +
    '" rx="2" class="' + (r.norm && v > r.norm * 1.6 ? "hi" : "") + '"/>').join("");
  const normY = r.norm ? (25 - r.norm / top * 24).toFixed(1) : null;
  return '<div class="river"><b>' + r.name + '</b><span class="tag ' + st.cls + '">' + st.label + "</span>" +
    '<svg class="spark" viewBox="0 0 104 26" role="img" aria-label="Portata degli ultimi 7 giorni, a destra oggi">' + bars +
      (normY ? '<line x1="0" x2="104" y1="' + normY + '" y2="' + normY + '"/>' : "") + "</svg>" +
    "<small>" + (r.q != null ? n(r.q) : "n/d") + (r.norm ? " / " + n(r.norm) : "") + " m³/s</small></div>";
}
// rosa dei venti: settori riparati colorati, pallino onda (colore mare) e pallino vento (colore sabbia)
function rose(d){
  const P = (deg, r) => [(32 + r * Math.sin(deg * Math.PI / 180)).toFixed(1), (32 - r * Math.cos(deg * Math.PI / 180)).toFixed(1)];
  const wedges = (d.shelter || []).map(c => { const a = CARD.indexOf(c) * 22.5, p0 = P(a - 11.25, 24), p1 = P(a + 11.25, 24);
    return '<path class="sh" d="M32 32L' + p0 + "A24 24 0 0 1 " + p1 + 'Z"/>'; }).join("");
  const dot = (deg, cls) => deg == null ? "" : '<circle class="' + cls + '" cx="' + P(deg, 24)[0] + '" cy="' + P(deg, 24)[1] + '" r="4"/>';
  return '<svg class="rose" viewBox="0 0 64 64" role="img" aria-label="Settori riparati: ' + ((d.shelter || []).join(", ") || "nessuno") + '">' +
    wedges + '<circle class="ring" cx="32" cy="32" r="24"/><text x="32" y="6.5" text-anchor="middle">N</text>' +
    dot(d.waveDir, "wv") + dot(d.windDir, "wd") + "</svg>";
}

// Profilo di temperatura: tabella compatta + grafico temperatura/profondità
const PROFILE_Z = [5, 10, 20, 30, 40, 50, 60, 80, 100];
function profileBlock(d){
  if (!d.deep) return "";
  const pts = d.deep.profile.filter(p => p[1] != null);
  const rows = PROFILE_Z.map(z => [z, tAt(d, z)]).filter(r => r[1] != null);
  if (!rows.length) return "";
  // raggruppa le profondità consecutive con la stessa temperatura (±0,1°)
  const groups = [];
  rows.forEach(([z, t]) => {
    const g = groups[groups.length - 1];
    if (g && Math.abs(g.t - t) <= 0.1) { g.to = z; } else groups.push({ from: z, to: z, t });
  });
  const table = groups.map(g => "<div><span>" + (g.from === g.to ? g.from + " m" : g.from + "–" + g.to + " m") +
    "</span><b>" + fmt(g.t, 1, "°") + "</b></div>").join("");
  // grafico SVG: temperatura in orizzontale, profondità verso il basso
  const zMax = Math.max(...pts.map(p => p[0])), ts = pts.map(p => p[1]);
  let tMin = Math.min(...ts), tMax2 = Math.max(...ts);
  if (tMax2 - tMin < 2) { const m = (tMax2 + tMin) / 2; tMin = m - 1; tMax2 = m + 1; }
  const W = 210, H = 150, L = 34, T = 14, X = t => L + (t - tMin) / (tMax2 - tMin) * (W - L - 10), Y = z => T + z / zMax * (H - T - 8);
  const path = pts.map((p, i) => (i ? "L" : "M") + X(p[1]).toFixed(1) + " " + Y(p[0]).toFixed(1)).join(" ");
  const yTicks = [0, 20, 40, 60, 80, 100].filter(z => z <= zMax).map(z =>
    '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + Y(z) + '" y2="' + Y(z) + '" class="g"/>' +
    '<text x="' + (L - 5) + '" y="' + (Y(z) + 3.5) + '" text-anchor="end">' + z + " m</text>").join("");
  const tc = d.deep.thermocline && d.deep.thermocline <= zMax
    ? '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + Y(d.deep.thermocline) + '" y2="' + Y(d.deep.thermocline) + '" class="tc"/>' : "";
  const svg = '<svg class="pf" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Profilo di temperatura fino a ' + zMax + ' m">' +
    yTicks + tc +
    '<text x="' + L + '" y="9">' + fmt(tMin, 0, "°") + '</text><text x="' + (W - 10) + '" y="9" text-anchor="end">' + fmt(tMax2, 0, "°") + "</text>" +
    '<path d="' + path + '" class="p"/></svg>';
  return '<div class="prof-body"><div class="prof-t">' + table + "</div>" + svg + "</div>";
}

function drawChart(canvas, d, marine, wx){
  if (typeof Chart === "undefined") {        // libreria non caricata: niente spazio vuoto
    canvas.parentElement.outerHTML = '<p class="prof-note">Grafico non disponibile (libreria non caricata).</p>';
    return null;
  }
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  const mi = marine ? index(marine.hourly) : new Map();
  const labels = d.all.map(i => wx.hourly.time[i].slice(11, 13));
  const wave = d.all.map(i => { const j = mi.get(wx.hourly.time[i]); return j == null ? null : marine.hourly.wave_height[j]; });
  return new Chart(canvas, {
    type: "bar",   // tipo base; ogni serie indica il proprio
    data: { labels, datasets: [
      { hidden: !marine, type: "line", label: "Onda (m)", data: wave, borderColor: c("--chart-wave"), backgroundColor: c("--chart-wave"), yAxisID: "y", tension: .3, pointRadius: 0, borderWidth: 2 },
      { type: "line", label: "Raffiche (kn)", data: d.all.map(i => wx.hourly.wind_gusts_10m[i]), borderColor: c("--chart-wind"), backgroundColor: c("--chart-wind"), yAxisID: "y1", tension: .3, pointRadius: 0, borderWidth: 2, borderDash: [4, 3] },
      { type: "bar", label: "Pioggia (mm)", data: d.all.map(i => wx.hourly.precipitation[i]), backgroundColor: c("--chart-rain"), yAxisID: "y2" }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: c("--muted"), boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: c("--muted"), maxTicksLimit: 8 }, grid: { color: c("--line") } },
        y: { position: "left", beginAtZero: true, ticks: { color: c("--chart-wave") }, grid: { color: c("--line") } },
        y1: { position: "right", beginAtZero: true, ticks: { color: c("--chart-wind") }, grid: { display: false } },
        y2: { display: false, beginAtZero: true, suggestedMax: 10 }
      }
    }
  });
}

/* ---------- Ciclo principale ---------- */
// Ogni richiesta ha un numero: se nel frattempo hai cambiato sito, la risposta vecchia viene scartata.
let reqId = 0;
const TTL = 20 * 60 * 1000, CHL_TTL = 6 * 3600 * 1000;   // dati meteo 20 min, clorofilla 6 h
const memCache = new Map();
const CACHE_V = 3;   // 3: quattro giorni passati, per poter ricalcolare la giornata di ieri nel diario
const cacheKey = s => "condizioniSub.cache." + s.lat + "," + s.lon;
function readCache(s){
  let c = memCache.get(cacheKey(s));
  if (!c) { c = load(cacheKey(s), null); if (c) memCache.set(cacheKey(s), c); }
  return c;
}
function writeCache(s, c){ memCache.set(cacheKey(s), c); save(cacheKey(s), c); }

// giorni calcolati per un sito a partire dai dati salvati (più profili e trasparenza dal file giornaliero)
// from = un giorno passato (diario): usa le misure satellitari disponibili fino a quel giorno
function daysFor(s, c, from = null){
  const ts = tempData && tempData.spots ? tempData.spots[s.name] : null;
  const upTo = a => (a || []).filter(x => !from || x.date <= from);
  let obs = null;
  if (tempData){
    const lakeWide = upTo(s.lake ? (((tempData.lake || {}).secchi || {}).sentinel3 || {}).lake : []);
    const own = upTo(ts && ts.secchi);
    if (own.length) obs = own[0];
    else if (lakeWide.length) obs = { date: lakeWide[0].date, v: lakeWide[0].mean, sat: "sentinel3", lakeWide: true };
  }
  const tu = upTo(ts && ts.turb);
  const turbObs = tu.length ? { ...tu[0], prev: tu[1] ? tu[1].tur : null } : null;
  const days = analyse(c.marine, c.wx, c.chl, s.base, c.rivers || [], s.shelter || [], obs, turbObs, from);
  days.forEach(d => { d.deep = ts ? (ts.days || []).find(x => x.date === d.date) || null : null; });
  return { days, ts };
}
function show(s, c){
  const { days, ts } = daysFor(s, c);
  allDays[s.name] = days;
  lastData = { t: c.t, marine: c.marine, wx: c.wx, chl: c.chl, days,
               deepInfo: ts ? { updated: tempData.updated, maxDepth: ts.maxDepth, lake: !!s.lake } : null };
  render(lastData);
  renderWhere();
}

// scarica meteo, mare e fiumi di un sito e li salva
async function fetchSpot(s, prev){
  const [marine, wx, rivers] = await Promise.all([
    s.lake ? null : getJSON(marineURL(s, 8)).catch(() => getJSON(marineURL(s, 7))),
    getJSON(weatherURL(s)),
    getRivers(s).catch(() => [])
  ]);
  if (marine && (!marine.hourly || marine.hourly.wave_height.every(v => v == null)))
    throw new Error("Nessun dato marino per questo punto: sposta le coordinate un po’ più al largo.");
  const c = { v: CACHE_V, t: Date.now(), marine, wx, rivers, chl: prev ? prev.chl : null, chlT: prev ? prev.chlT : 0 };
  writeCache(s, c);
  return c;
}

// gli altri siti, uno alla volta e in sottofondo, per il confronto “Dove andare”
let othersRun = 0;
async function loadOthers(){
  const run = ++othersRun;
  for (const s of spots.slice()){
    if (run !== othersRun) return;
    let c = readCache(s);
    if (c && c.v !== CACHE_V) c = null;
    if (!c || Date.now() - c.t > 60 * 60 * 1000){
      try { c = await fetchSpot(s, c); } catch { /* resta il dato salvato, se c’è */ }
    }
    if (run !== othersRun) return;
    if (c) { allDays[s.name] = daysFor(s, c).days; renderWhere(); }
  }
}

async function refresh(force = false){
  const my = ++reqId;
  const s = spots[sel];
  const stillCurrent = () => my === reqId && spots[sel] === s;
  getTemps().then(changed => {
    if (!changed) return;
    const cc = readCache(s);
    if (stillCurrent() && cc && cc.v === CACHE_V) show(s, cc);
    loadOthers();
  });
  $("title").textContent = s.name;
  let c = readCache(s);
  if (c && c.v !== CACHE_V) c = null;              // cache di una versione precedente
  const fresh = c && Date.now() - c.t < TTL;

  if (c) show(s, c);                         // mostra subito l’ultimo dato salvato
  else { $("days").innerHTML = ""; $("now").innerHTML = ""; $("heroTop").innerHTML = ""; }
  if (fresh && !force) { loadOthers(); return; }
  $("meta").textContent = (c ? "Aggiornamento dati per " : "Caricamento dati per ") + s.name + "…";

  // clorofilla in parallelo e senza bloccare: è lenta e cambia poco
  const needChl = !s.lake && (force || !c || !c.chlT || Date.now() - c.chlT > CHL_TTL);
  const chlP = needChl ? getChlorophyll(s).catch(() => null) : null;

  try {
    c = await fetchSpot(s, c);
    if (!stillCurrent()) return;
    show(s, c);
    loadOthers();
  } catch (e) {
    if (!stillCurrent()) return;
    if (/postMessage|Failed to fetch|Load failed|NetworkError|clone/i.test(e.message)) {
      $("meta").textContent = c ? "Connessione assente: mostro i dati salvati." :
        "Questa anteprima non permette di contattare i servizi meteo. Apri la pagina da GitHub Pages o da un browser.";
      return;
    }
    $("meta").textContent = e.message === "timeout"
      ? "Il servizio meteo non ha risposto in tempo. Premi Aggiorna per riprovare."
      : (e.message.startsWith("Nessun") ? e.message : "Dati non disponibili (" + e.message + "). Premi Aggiorna per riprovare.");
    return;
  }

  if (chlP){
    const chl = await chlP;
    if (!stillCurrent() || !c) return;
    c.chl = chl; c.chlT = Date.now();
    writeCache(s, c);
    show(s, c);
  }
}

/* ---------- Diario: la visibilità vista davvero, per tarare le stime ---------- */
const LOG_KEY = "condizioniSub.diario", REPO = "fluppi/condizioni-sub";
let diary = load(LOG_KEY, []);
const num = v => parseFloat(String(v).replace(",", "."));
const r2 = v => v == null || !isFinite(v) ? null : Math.round(v * 100) / 100;
const escH = t => String(t).replace(/[&<>"']/g, ch => "&#" + ch.charCodeAt(0) + ";");
const todayIso = () => lastData ? localToday(lastData.wx) : new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const seenTag = date => {
  const e = diary.find(x => x.site === spots[sel].name && x.date === date);
  return e ? '<span class="tag big good" title="Visibilità vista in immersione">' + ico("check") + "visto " + fmt(e.seen, e.seen % 1 ? 1 : 0, " m") + "</span>" : "";
};

// fotografia della stima e dei dati che l’hanno prodotta: serve a rifare i conti quando si tarano le costanti
function snapshot(s, d){
  return {
    est: { m: r2(d.visM), lo: d.visLo, hi: d.visHi, base: s.base, label: d.visLabel },
    in: {
      secchi: d.secchi ? { v: d.secchi.v, date: d.secchi.date, sat: d.secchi.sat, lakeWide: d.secchi.lakeWide || undefined } : null,
      turb: d.turb ? { tur: d.turb.tur, date: d.turb.date } : null,
      chl: r2(d.chl), rain72: r2(d.rain72), rainVis: r2(d.rainVis),
      prevU: r2(d.prevU), prevHs: r2(d.prevHs), prevProt: sheltered(d.prevWaveDir, d.shelter),
      dayU: r2(d.dayU), hs: r2(d.hs), tp: r2(d.tp), dayProt: sheltered(d.waveDir, d.shelter),
      gust: r2(d.gust), prevGust: r2(d.prevGust), surf: d.surf,
      riv: (d.riv || []).map(r => ({ name: r.name, w: r.w, ratio: r2(r.ratio) })),
      thermo: d.deep ? d.deep.thermocline : null
    },
    fac: (d.visFac || []).map(f => f.t + (f.pct ? " −" + f.pct + "%" : ""))
  };
}
// la giornata (anche di ieri) ricalcolata dai dati salvati del sito
function dayFor(s, date){
  const c = readCache(s);
  if (!c || c.v !== CACHE_V) return null;
  try { return daysFor(s, c, date).days.find(d => d.date === date) || null; } catch { return null; }
}
const issueURL = e => "https://github.com/" + REPO + "/issues/new?title=" +
  encodeURIComponent("Immersione " + e.site + " " + e.date + ": " + fmt(e.seen, 1, " m")) +
  "&body=" + encodeURIComponent("```json\n" + JSON.stringify(e) + "\n```");

function renderLog(){
  const t = todayIso();
  $("logDay").innerHTML = [[t, "Oggi"], [addDays(t, -1), "Ieri"]].map(([d, l]) => '<option value="' + d + '">' + l + " · " + dayNum(d) + "</option>").join("");
  $("logList").innerHTML = diary.map((e, i) =>
    '<li><span class="l-d">' + dayNum(e.date) + "</span>" +
    '<span class="l-s">' + escH(e.site) + (e.depth || e.note ? "<small>" + [e.depth ? "a " + fmt(e.depth, 0, " m") : "", e.note ? escH(e.note) : ""].filter(Boolean).join(" · ") + "</small>" : "") + "</span>" +
    '<span class="l-v"><b>' + fmt(e.seen, e.seen % 1 ? 1 : 0, " m") + "</b><small>stima " + (e.est ? rng({ visLo: e.est.lo, visHi: e.est.hi }) + " m" : "n/d") + "</small></span>" +
    '<a href="' + issueURL(e) + '" target="_blank" rel="noopener" title="Salva questa immersione nel repository GitHub (pubblico)">GitHub ↗</a>' +
    '<button class="l-x" data-i="' + i + '" aria-label="Elimina">✕</button></li>').join("");
  $("logList").querySelectorAll(".l-x").forEach(b => b.onclick = () => {
    if (!confirm("Eliminare questa immersione dal diario?")) return;
    diary.splice(+b.dataset.i, 1); save(LOG_KEY, diary); renderLog(); if (lastData) render(lastData);
  });
  // quanto sbaglia la stima, in media: visto / stimato
  const rs = diary.filter(e => e.est && e.est.m > 0).map(e => e.seen / e.est.m);
  $("logSum").textContent = rs.length >= 3
    ? rs.length + " immersioni: in media visto × " + fmt(rs.reduce((a, b) => a + b, 0) / rs.length, 2) + " rispetto alla stima" : "";
}
function mergeDiary(list){
  const ids = new Set(diary.map(e => e.id));
  const add = list.filter(e => e && e.id && e.site && e.date && isFinite(e.seen) && !ids.has(e.id));
  diary = diary.concat(add).sort((a, b) => b.date.localeCompare(a.date) || String(b.t).localeCompare(String(a.t)));
  save(LOG_KEY, diary);
  return add.length;
}
$("btnLog").onclick = () => {
  const open = $("logBox").hidden; $("logBox").hidden = !open;
  $("btnLog").setAttribute("aria-expanded", open);
  if (open) { $("logMsg").textContent = ""; renderLog(); $("logM").focus(); }
};
$("btnLogSave").onclick = () => {
  const s = spots[sel], date = $("logDay").value, m = num($("logM").value), z = num($("logZ").value);
  if (!(m >= 0.5 && m <= 60)) { $("logMsg").textContent = "Scrivi i metri di visibilità che hai visto (da 0,5 a 60)."; return; }
  const d = dayFor(s, date);
  const e = { id: date + "|" + s.name + "|" + Date.now().toString(36), site: s.name, lat: s.lat, lon: s.lon, lake: s.lake ? true : undefined,
              date, seen: m, depth: z > 0 ? z : null, note: $("logNote").value.trim() || null, t: new Date().toISOString(),
              ...(d ? snapshot(s, d) : { est: null }) };
  mergeDiary([e]);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // chiede al browser di non cancellare i dati
  $("logM").value = $("logZ").value = $("logNote").value = "";
  $("logMsg").textContent = d ? "" : "Salvato senza stima: i dati del sito per quel giorno non erano caricati.";
  renderLog(); if (lastData) render(lastData);
};
$("btnLogCopy").onclick = async () => {
  const txt = JSON.stringify(diary);
  try { await navigator.clipboard.writeText(txt); $("logMsg").textContent = "Diario copiato (" + diary.length + " immersioni)."; }
  catch { prompt("Copia il diario:", txt); }
};
$("btnLogDown").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(diary, null, 1)], { type: "application/json" }));
  a.download = "diario-sub-" + todayIso() + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$("btnLogImport").onclick = () => {
  const v = prompt("Incolla il diario copiato da un altro dispositivo:");
  if (!v) return;
  try {
    const list = JSON.parse(v);
    if (!Array.isArray(list)) throw new Error();
    $("logMsg").textContent = "Aggiunte " + mergeDiary(list) + " immersioni.";
    renderLog(); if (lastData) render(lastData);
  } catch { $("logMsg").textContent = "Il testo incollato non è un diario valido."; }
};

/* ---------- Gestione siti ---------- */
function addSpot(name, lat, lon){
  spots.push({ name, lat: +(+lat).toFixed(4), lon: +(+lon).toFixed(4), lake: $("isLake").checked || undefined,
    base: parseFloat($("baseIn").value.replace(",", ".")) || ($("isLake").checked ? 8 : 15) });
  sel = spots.length - 1; save(STORE_KEY, spots); save(SEL_KEY, sel);
  $("addBox").hidden = true; $("btnAdd").setAttribute("aria-expanded", "false");
  renderSpots(); refresh();
}

let qTimer;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  const q = $("q").value.trim(); if (q.length < 3) { $("results").innerHTML = ""; return; }
  qTimer = setTimeout(async () => {
    try {
      const j = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=6&language=it&name=" + encodeURIComponent(q));
      $("results").innerHTML = "";
      (j.results || []).forEach(r => {
        const li = document.createElement("li"), b = document.createElement("button");
        b.textContent = r.name + (r.admin1 ? ", " + r.admin1 : "") + " (" + (r.country_code || "") + ")";
        b.onclick = () => addSpot(r.name, r.latitude, r.longitude);
        li.appendChild(b); $("results").appendChild(li);
      });
      $("addMsg").textContent = (j.results || []).length ? "" : "Nessuna località trovata. Inserisci le coordinate a mano.";
    } catch { $("addMsg").textContent = "Ricerca non disponibile. Inserisci le coordinate a mano."; }
  }, 350);
});

$("btnSaveManual").onclick = () => {
  const lat = parseFloat($("lat").value.replace(",", ".")), lon = parseFloat($("lon").value.replace(",", "."));
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180)
    return $("addMsg").textContent = "Coordinate non valide: usa gradi decimali, es. 43.170 e 6.535.";
  addSpot($("nm").value.trim() || lat.toFixed(3) + ", " + lon.toFixed(3), lat, lon);
};
$("btnGeo").onclick = () => {
  if (!navigator.geolocation) return $("addMsg").textContent = "Il browser non fornisce la posizione.";
  navigator.geolocation.getCurrentPosition(
    p => { $("lat").value = p.coords.latitude.toFixed(4); $("lon").value = p.coords.longitude.toFixed(4); $("addMsg").textContent = "Posizione inserita: dai un nome e salva."; },
    () => $("addMsg").textContent = "Posizione non concessa dal browser."
  );
};
$("btnAdd").onclick = () => {
  const open = $("addBox").hidden; $("addBox").hidden = !open;
  $("btnAdd").setAttribute("aria-expanded", open); if (open) $("q").focus();
};
$("btnRefresh").onclick = () => refresh(true);
$("btnBase").onclick = () => {
  const s = spots[sel];
  const v = prompt("Visibilità orizzontale tipica a " + s.name + " in una giornata buona (metri):", s.base);
  if (v == null) return;
  const n = parseFloat(String(v).replace(",", "."));
  if (!isFinite(n) || n < 1 || n > 60) return alert("Inserisci un numero tra 1 e 60.");
  s.base = n; save(STORE_KEY, spots); refresh();
};
$("btnShelter").onclick = () => {
  const s = spots[sel];
  const v = prompt("Direzioni da cui " + s.name + " è riparato (da dove arrivano vento e onda), separate da virgola.\n" +
    "Usa: N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO. Lascia vuoto se il sito è esposto ovunque.",
    (s.shelter || []).join(", "));
  if (v == null) return;
  const list = v.toUpperCase().split(/[\s,;]+/).filter(Boolean);
  const bad = list.filter(x => !CARD.includes(x));
  if (bad.length) return alert("Direzioni non riconosciute: " + bad.join(", "));
  s.shelter = [...new Set(list)]; save(STORE_KEY, spots); refresh();
};
$("btnRemove").onclick = () => {
  if (spots.length < 2 || !confirm("Rimuovere " + spots[sel].name + "?")) return;
  delete allDays[spots[sel].name]; spots.splice(sel, 1); sel = 0; save(STORE_KEY, spots); save(SEL_KEY, sel); renderSpots(); refresh();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => lastData && render(lastData));

renderSpots(); refresh();
</script>
